name: Fast News Agent
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run news agent
        env:
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: python news-agent.py
