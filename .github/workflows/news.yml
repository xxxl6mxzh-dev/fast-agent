name: Fast News Agent
on:
#  schedule:
#    - cron: '0 1 * * *'   # 已切到本地定时任务，GitHub停用
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run news agent
        env:
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: python news-agent.py

      - name: Commit date-lock (防重复)
        run: |
          git config user.name "FastAgent"
          git config user.email "fast@agent.local"
          git add .last_sent .sending 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "[auto] 更新早报日期锁 $(date +%Y%m%d)" && git push)
