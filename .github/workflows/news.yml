name: Fast 新闻速递
on:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 9:00 = UTC 1:00
  workflow_dispatch:       # 允许手动触发测试

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行新闻速递
        env:
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: python news-agent.py
